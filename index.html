<script>

const GS_URL = 'https://script.google.com/macros/s/AKfycbyDqs49lqj_L911zV3WQj3aoSlzJQXvw8Mt16ecPRvlcK20WHY0Bwbb75eX_G0L9v-T/exec';

// SELEPAS INI, SEMUA FUNGSI JAVASCRIPT SAMA SEPERTI VERSI SEBELUMNYA
// Pastikan fungsi gsRequest menggunakan GS_URL di atas.
// Contoh fungsi gsRequest:
async function gsRequest(action, payload) {
  const params = new URLSearchParams({action});
  Object.entries(payload).forEach(([k,v])=>{
    params.append(k, typeof v==='object' ? encodeURIComponent(JSON.stringify(v)) : encodeURIComponent(String(v)));
  });
  const res = await fetch(`${GS_URL}?${params.toString()}`, { method: 'GET', redirect: 'follow' });
  if (!res.ok) throw new Error('HTTP '+res.status);
  const text = await res.text();
  try { return JSON.parse(text); } catch(e) { throw new Error('Response bukan JSON'); }
}
